apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: devboard-cluster1
  region: ap-south-1
  version: "1.36"

iam:
  withOIDC: true

managedNodeGroups:
  - name: devboard-cluster-ng1
    instanceType: c7i-flex.large
    minSize: 1
    maxSize: 4
    desiredCapacity: 2
    volumeSize: 20
    volumeType: gp3
    ssh:
      enableSsm: true
    iam:
      withAddonPolicies:
        autoScaler: true
        ebs: true

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: metrics-server
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true
